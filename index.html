<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario de Alimento — Grupo Acuícola Santa Fe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#F2F5F9; --card:#FFFFFF; --bg2:#EEF2F7; --border:#E1E8F0; --border2:#D8E3EE;
  --teal:#007A68; --teal-light:#00C9A7; --blue:#1A6EA8; --navy:#1F4E79; --amber:#D97B1A; --red:#C0303B;
  --text:#1C2B3A; --muted:#6B859E; --muted2:#94A8BB;
  --shadow:0 1px 2px rgba(20,40,60,.04),0 4px 14px rgba(20,40,60,.06);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
h1,h2,h3,.kpi-value,.num-big{font-family:'Barlow Condensed',sans-serif;}
.tnum{font-variant-numeric:tabular-nums;}
.app{display:flex;min-height:100vh;}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

/* ---------- Banner preview ---------- */
.preview-banner{background:#FFF6E8;border:1px solid #F2D2A6;color:#8A4E0E;border-radius:10px;padding:9px 14px;font-size:12.5px;margin-bottom:16px;display:flex;gap:8px;align-items:center;}

/* ---------- Sidebar ---------- */
.sidebar{width:250px;flex-shrink:0;background:linear-gradient(180deg,#173B60,#12304F 55%,#0E2740);color:#fff;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;}
.brand-logo{background:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:center;}
.brand-logo img{max-width:100%;height:auto;display:block;}
.brand h1{margin:12px 6px 0;font-size:17px;line-height:1.15;font-weight:700;color:#fff;}
.brand-sub{padding:6px 6px 18px;font-size:12px;color:#8FB3D1;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px;}
.side-nav{display:flex;flex-direction:column;gap:4px;flex:1;}
.side-link{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;border:none;border-left:3px solid transparent;background:transparent;color:#9FC1DE;font-size:14.5px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;text-align:left;transition:.15s;width:100%;}
.side-link .icon{stroke:#9FC1DE;}
.side-link:hover{background:rgba(255,255,255,.06);color:#fff;}
.side-link.active{background:rgba(255,255,255,.12);color:#fff;border-left-color:var(--dot);}
.side-link.active .icon{stroke:var(--dot);}
.side-link .lbl-txt{flex:1;}
.nav-chip{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.1);color:#CFE3F3;font-variant-numeric:tabular-nums;}
.nav-chip.bad{background:rgba(230,57,70,.25);color:#FFC7CB;}
.nav-chip.warn{background:rgba(244,162,97,.25);color:#FFDDBE;}
.nav-chip.good{background:rgba(0,201,167,.2);color:#B5F3E7;}
.side-footer{border-top:1px solid rgba(255,255,255,.1);padding-top:14px;}
.sync-card{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-radius:10px;padding:10px 12px;}
.sync-card .icon{stroke:#8FB3D1;}
.sync-label{font-size:12px;font-weight:700;color:#fff;}
.sync-time{font-size:10.5px;color:#8FB3D1;margin-top:1px;}
#refreshBtn{background:none;border:none;padding:4px;cursor:pointer;border-radius:6px;display:flex;}
#refreshBtn:hover{background:rgba(255,255,255,.12);}
#refreshBtn:hover .icon{stroke:#fff;}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;padding:24px 28px 60px;max-width:1360px;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
.page-head h2{margin:0;font-size:30px;font-weight:700;line-height:1;}
.page-head .crumb{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px;}
.head-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:30px;font-size:13px;font-weight:700;}
.head-chip .dot{width:8px;height:8px;border-radius:50%;}
.st-bad{background:rgba(192,48,59,.1);color:#9B1F2A;} .st-bad .dot{background:var(--red);}
.st-warn{background:rgba(217,123,26,.12);color:#94520D;} .st-warn .dot{background:var(--amber);}
.st-good{background:rgba(0,122,104,.1);color:#00594C;} .st-good .dot{background:var(--teal);}
.st-na{background:var(--bg2);color:var(--muted);} .st-na .dot{background:var(--muted2);}
.panel{display:none;} .panel.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
@media(max-width:1150px){.kpis{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.kpis{grid-template-columns:1fr;} .main{padding:16px 14px 50px;} .page-head h2{font-size:24px;} .legend-hide-sm{display:none;}}
.kpi{background:var(--card);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);border:1px solid var(--border);position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);}
.kpi-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.kpi .lbl{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;}
.kpi-icon{width:34px;height:34px;border-radius:10px;background:var(--tint);display:flex;align-items:center;justify-content:center;}
.kpi-icon .icon{stroke:var(--accent);width:17px;height:17px;}
.kpi-value{font-size:34px;font-weight:700;line-height:1.05;}
.kpi-value small{font-size:18px;font-weight:600;color:var(--muted);margin-left:3px;}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:6px;}
.kpi .sub b{color:var(--text);}
.meter{height:7px;background:var(--bg2);border-radius:10px;margin-top:10px;position:relative;overflow:visible;}
.meter > span{display:block;height:100%;border-radius:10px;background:var(--bar);transition:width .4s;}
.meter .tick{position:absolute;top:-3px;width:2px;height:13px;background:#B6C5D4;border-radius:2px;}
.meter-scale{display:flex;justify-content:space-between;font-size:10px;color:var(--muted2);margin-top:4px;}
.consumo-input{display:flex;align-items:baseline;gap:6px;border:1.5px solid var(--border2);border-radius:9px;padding:2px 10px;background:var(--bg2);transition:.15s;}
.consumo-input:focus-within{border-color:var(--amber);background:#fff;box-shadow:0 0 0 3px rgba(217,123,26,.12);}
.consumo-input input{width:100%;border:none;background:transparent;font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;color:var(--text);padding:2px 0;outline:none;}
.consumo-input span{font-size:13px;color:var(--muted);font-weight:600;}

/* ---------- Cards ---------- */
.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-bottom:16px;}
.grid2.even{grid-template-columns:1fr 1fr;}
@media(max-width:1000px){.grid2,.grid2.even{grid-template-columns:1fr;} .app{flex-direction:column;} .sidebar{width:100%;height:auto;position:relative;}}
.grid2 > *, .kpis > *{min-width:0;}
.card{min-width:0;background:var(--card);border-radius:14px;border:1px solid var(--border);padding:18px 20px;box-shadow:var(--shadow);}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap;}
.card h3{margin:0;font-size:20px;font-weight:600;}
.card .hint{font-size:12px;color:var(--muted);}
.chart-box{position:relative;height:290px;}
.chart-box.sm{height:240px;}

/* ---------- Tablas ---------- */
.tbl-wrap{border:1px solid var(--border);border-radius:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
@media(max-width:700px){.tbl-wrap:not(.fit) table{min-width:620px;}}
.cmp-table{table-layout:fixed;}
.cmp-table th{white-space:normal;line-height:1.25;padding:10px 6px;vertical-align:middle;}
.cmp-table td{padding:11px 6px;font-size:14px;}
.cmp-table td:first-child, .cmp-table th:first-child{padding-left:12px;}
.cmp-table .pill{max-width:100%;}
.mini-bar{height:4px;background:var(--bg2);border-radius:4px;overflow:hidden;width:70%;max-width:90px;margin:5px auto 0;}
.mini-bar span{display:block;height:100%;border-radius:4px;}
.cmp-table .pill, .cmp-table .head-chip{white-space:nowrap;}
@media(max-width:600px){
  .cmp-table th{font-size:9.5px;letter-spacing:.2px;padding:8px 3px;}
  .cmp-table td{font-size:13px;padding:10px 3px;}
  .cmp-table td:first-child, .cmp-table th:first-child{padding-left:8px;}
  .cmp-table .pill{padding:3px 7px;font-size:11px;}
  .cmp-table .pill .dot, .cmp-table .head-chip .dot{display:none;}
  .cmp-table .head-chip{padding:3px 6px !important;font-size:11.5px !important;}
}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{background:#F5F8FB;color:var(--muted);text-align:left;padding:10px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;border-bottom:1px solid var(--border);white-space:nowrap;}
thead th.r, td.r{text-align:right;}
thead th.c, td.c{text-align:center;}
tbody td{padding:0;border-bottom:1px solid #EEF2F6;vertical-align:middle;}
tbody tr:nth-child(even) td{background:#FAFCFD;}
tbody tr:hover td{background:#F0F7FF;}
tbody tr:last-child td{border-bottom:none;}
td input, td select{width:100%;border:1px solid transparent;border-radius:6px;background:transparent;padding:8px 8px;font-size:13.5px;color:var(--text);font-family:'Inter',sans-serif;}
td input:hover, td select:hover{border-color:var(--border2);}
td input:focus, td select:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(26,110,168,.12);}
td .f-kg, td .ff-cantidad{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
td .f-micraje, td .ff-micraje{text-align:center;}
.prod-cell{display:flex;align-items:center;gap:8px;padding-left:8px;}
.prod-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.prod-cell select{padding-left:2px;}
.share{display:flex;align-items:center;gap:8px;padding:0 10px;}
.share .bar{flex:1;height:6px;background:var(--bg2);border-radius:6px;overflow:hidden;min-width:40px;}
.share .bar span{display:block;height:100%;border-radius:6px;}
.share b{font-size:12px;color:var(--muted);font-weight:600;width:38px;text-align:right;font-variant-numeric:tabular-nums;}
tfoot td{font-weight:700;background:#F5F8FB;color:var(--navy);padding:11px 10px;border-top:1px solid var(--border);font-variant-numeric:tabular-nums;}
.ro td{padding:10px;}
.del-btn{background:none;border:none;cursor:pointer;padding:6px;border-radius:7px;display:inline-flex;opacity:.45;transition:.15s;}
tr:hover .del-btn{opacity:1;}
.del-btn:hover{background:rgba(192,48,59,.1);}
.del-btn .icon{stroke:var(--red);width:16px;height:16px;}
.add-row-btn{margin-top:12px;background:#fff;color:var(--teal);border:1.5px dashed #9CCFC6;padding:8px 16px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s;}
.add-row-btn .icon{stroke:var(--teal);width:15px;height:15px;}
.add-row-btn:hover{background:rgba(0,122,104,.06);border-style:solid;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;}
.pill .dot{width:7px;height:7px;border-radius:50%;}
.date-badge{display:inline-block;padding:3px 9px;border-radius:6px;background:var(--bg2);font-size:12px;font-weight:600;color:var(--navy);}
.date-badge.soon{background:rgba(26,110,168,.1);color:var(--blue);}
.date-badge.late{background:rgba(192,48,59,.1);color:var(--red);}

/* ---------- Timeline semanas ---------- */
.weeks{display:flex;flex-direction:column;gap:8px;}
.wk{display:grid;grid-template-columns:78px 1fr 92px;align-items:center;gap:10px;font-size:13px;}
.wk .wl{color:var(--muted);font-weight:600;}
.wk .wb{height:10px;background:var(--bg2);border-radius:10px;overflow:hidden;}
.wk .wb span{display:block;height:100%;border-radius:10px;}
.wk .wv{text-align:right;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;}
.wk.out .wv{color:var(--red);}
.alert{font-size:13px;color:var(--muted);background:var(--bg2);border-radius:8px;padding:10px 14px;margin-top:10px;}
.alert.good{background:rgba(0,122,104,.08);color:#005A4D;}
.alert.warn{background:rgba(217,123,26,.1);color:#8A4E0E;}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:13px;gap:8px;text-align:center;}
.empty-state .icon{width:30px;height:30px;stroke:var(--muted2);}
.save-tag{position:fixed;bottom:18px;right:22px;background:var(--navy);color:#fff;font-size:12.5px;padding:8px 14px;border-radius:8px;opacity:0;transform:translateY(8px);transition:.3s;pointer-events:none;}
.save-tag.show{opacity:1;transform:none;}
</style>
</head>

<script>

  santafe: {name:'Santa Fe', a:'#007A68', b:'#00C9A7'},
  owen1:   {name:'Owen 1',   a:'#8B5A2B', b:'#F4A261'},
  owen2:   {name:'Owen 2',   a:'#7A1A22', b:'#E63946'}

const FEED_TYPES = [
  'VIMIFOS TOTAL RANGE 1.8 35',
  'VIMIFOS XTRU-DIX 00 FORTE 42',
  'VIMIFOS XTRU-DIX 0 FORTE 40',
  'VIMIFOS XTRU-DIX UNO GL 38',
  'VIMIFOS XTRU-DIX DOS GL 35',
  'SPECIAL RACEWAYS 0',
  'SPECIAL RACEWAYS 1',
  'CAMARON ENG EXT AD 2.1 X3 MM (35-7) PEDREGAL'
];
const PROD_COLORS = ['#007A68','#1A6EA8','#D97B1A','#7A4FB5','#C0303B','#00A3B4','#8B5A2B','#B8892A'];
function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function prodColor(m){ const i = FEED_TYPES.indexOf(m); return i>=0 ? PROD_COLORS[i] : (m ? '#9AAAB8' : '#D0DAE4'); }
function prodShort(m){
  if(!m) return 'Sin producto';
  if(m.includes('PEDREGAL')) return 'PEDREGAL EXT AD 2.1 (35-7)';
  return m.replace('VIMIFOS ','');
}
const STORAGE_KEY = 'inventarioAlimentoState_v1';
const META_DIAS = 14, CRIT_DIAS = 7, ESCALA_DIAS = 30;

let TODAY = new Date(); TODAY.setHours(0,0,0,0);
function refreshToday(){ TODAY = new Date(); TODAY.setHours(0,0,0,0); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseISO(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fDate(d){ return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short'}).replace('.',''); }
function fDateLong(d){ return d.toLocaleDateString('es-MX',{weekday:'short',day:'2-digit',month:'short'}).replace(/\./g,''); }

function defaultState(){
  return {
    santafe:{ consumo: 30000, rows:[
        {fecha:'2026-06-01', bodega:'CALERA', marca:FEED_TYPES[0], micraje:'1.8', kg:20000},
        {fecha:'2026-06-01', bodega:'CAJA SECA 1', marca:FEED_TYPES[0], micraje:'1.8', kg:18300},
        {fecha:'2026-06-01', bodega:'CAJA SECA 2', marca:FEED_TYPES[0], micraje:'1.8', kg:10000},
        {fecha:'2026-06-01', bodega:'CASETA C-1', marca:FEED_TYPES[0], micraje:'1.8', kg:28200},
        {fecha:'2026-06-01', bodega:'CARCAMO 1', marca:FEED_TYPES[0], micraje:'1.8', kg:33000},
        {fecha:'2026-06-01', bodega:'CASETA A-1', marca:FEED_TYPES[0], micraje:'1.8', kg:35000},
        {fecha:'2026-06-01', bodega:'CARCAMO 1', marca:FEED_TYPES[1], micraje:'0.8', kg:15000}
      ], facturas:[] },
    owen1:{consumo:0, rows:[], facturas:[]},
    owen2:{consumo:0, rows:[], facturas:[]}
  };
}

function toArray(v){
  if(Array.isArray(v)) return v.filter(x=>x!=null);
  if(v && typeof v==='object') return Object.keys(v).sort((a,b)=>a-b).map(k=>v[k]).filter(x=>x!=null);
  return [];
}
function ensureState(st){
  if(!st || typeof st!=='object') st = {};
  Object.keys(SITES).forEach(k=>{
    if(!st[k] || typeof st[k]!=='object') st[k] = {consumo:0, rows:[], facturas:[]};
    st[k].rows = toArray(st[k].rows);
    st[k].facturas = toArray(st[k].facturas);
    if(st[k].consumo==null) st[k].consumo = 0;
  });
  return st;
}
function loadState(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); if(raw) return ensureState(JSON.parse(raw)); }catch(e){}
  return defaultState();
}
let state = loadState();

const firebaseConfig = {
  apiKey: "AIzaSyAXsHDjxwnp21ZqNnwcTXIgwkb0LsEOTG0",
  authDomain: "cosechas-santa-fe.firebaseapp.com",
  databaseURL: "https://cosechas-santa-fe-default-rtdb.firebaseio.com",
  projectId: "cosechas-santa-fe",
  storageBucket: "cosechas-santa-fe.firebasestorage.app",
  messagingSenderId: "219648455867",
  appId: "1:219648455867:web:2994e68e5f9663d3d4a59e"
};
let firebaseOK = false, db = null, dbRef = null;
try{
  if(typeof firebase !== 'undefined'){
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    dbRef = db.ref('inventarioAlimentoState');
    firebaseOK = true;
  }
}catch(e){ console.error('No se pudo iniciar Firebase:', e); }
let firebaseSeeded = false, firebaseSaveTimer = null;

// Firebase reordena llaves y elimina listas vacías: comparamos una versión normalizada y ordenada
function stableStr(v){
  if(Array.isArray(v)) return '['+v.map(stableStr).join(',')+']';
  if(v && typeof v==='object') return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+stableStr(v[k])).join(',')+'}';
  return JSON.stringify(v);
}

let dirtySites = new Set();
function saveState(k){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  touchUpdated();
  const tag = document.getElementById('saveTag');
  if(tag){ tag.classList.add('show'); clearTimeout(saveState._t); saveState._t = setTimeout(()=>tag.classList.remove('show'),900); }
  if(!firebaseOK) return;
  if(k && SITES[k]) dirtySites.add(k); else Object.keys(SITES).forEach(x=>dirtySites.add(x));
  clearTimeout(firebaseSaveTimer);
  firebaseSaveTimer = setTimeout(pushToFirebase, 600);
}
// Copia limpia: sin undefined/NaN (Firebase rechaza undefined)
function cleanForFirebase(v){ return JSON.parse(JSON.stringify(v, (key,val)=> (typeof val==='number' && !isFinite(val)) ? 0 : val)); }
function pushToFirebase(){
  if(!firebaseOK) return;
  if(!firebaseSeeded){ clearTimeout(firebaseSaveTimer); firebaseSaveTimer = setTimeout(pushToFirebase, 800); return; } // espera a tener los datos del equipo
  const sites = [...dirtySites]; dirtySites.clear();
  if(!sites.length) return;
  const upd = {}; sites.forEach(k=>{ upd[k] = cleanForFirebase(state[k]); });
  // Solo se escriben los sitios modificados: dos personas editando sitios distintos no se pisan
  dbRef.update(upd).catch(err=>{
    console.error('Firebase write error', err);
    sites.forEach(k=>dirtySites.add(k));
    setSyncStatus('🔴 No se pudo guardar en la nube — reintentando', false);
    clearTimeout(firebaseSaveTimer); firebaseSaveTimer = setTimeout(pushToFirebase, 5000);
  });
}
function setSyncStatus(text, ok){
  const el = document.getElementById('syncStatus'); if(!el) return;
  el.textContent = text; el.style.color = ok ? '#fff' : '#F4B8B8';
}
function touchUpdated(){
  const el = document.getElementById('lastUpdated');
  if(el) el.textContent = 'Actualizado ' + new Date().toLocaleString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

/* ---------- Cálculos ---------- */
const fmt = n => Math.round(n||0).toLocaleString('es-MX');
const fmtTon = n => ((n||0)/1000).toLocaleString('es-MX',{minimumFractionDigits:1,maximumFractionDigits:1});
const siteTotal = k => state[k].rows.reduce((s,r)=>s+Math.max(0,parseFloat(r.kg)||0),0);
const siteConsumo = k => Math.max(0, parseFloat(state[k].consumo)||0);
const facturasTotal = k => state[k].facturas.reduce((s,r)=>s+Math.max(0,parseFloat(r.cantidad)||0),0);
const siteDias = k => { const c=siteConsumo(k); return c>0 ? siteTotal(k)/c : null; };

// Simula día a día: stock actual y stock incluyendo facturas en su fecha de llegada
function simulate(k, horizon){
  const c = siteConsumo(k), total = siteTotal(k);
  const arr = {};
  state[k].facturas.forEach(f=>{
    const q = parseFloat(f.cantidad)||0; if(!q) return;
    let d = parseISO(f.fecha); let off = d ? Math.round((d-TODAY)/864e5) : 0;
    if(off<0) off = 0; arr[off] = (arr[off]||0)+q;
  });
  const solo=[], conF=[]; let s1=total, s2=total + (arr[0]||0); let agotaConF = null;
  for(let d=0; d<=horizon; d++){
    if(d>0){ s1=Math.max(0,s1-c); s2=s2-c; if(s2<=0 && agotaConF===null) agotaConF = d + s2/c; s2=Math.max(0,s2); s2 += (arr[d]||0); }
    solo.push(s1); conF.push(s2);
  }
  return {solo, conF, agotaConF, arrivals:arr};
}
function nivel(d){
  if(d===null) return {cls:'na', txt:'Sin consumo', color:'#94A8BB'};
  if(d<CRIT_DIAS) return {cls:'bad', txt:'Crítico', color:'#C0303B'};

  return {cls:'good', txt:'Suficiente', color:'#007A68'};
}

let currentTab = 'santafe';
function buildTabs(){
  const tabs = document.getElementById('tabs'); tabs.innerHTML='';
  Object.keys(SITES).concat(['general']).forEach(k=>{
    const btn = document.createElement('button');
    const accent = k==='general' ? '#5FA8E0' : SITES[k].b;
    btn.className = 'side-link'+(k===currentTab?' active':'');
    btn.style.setProperty('--dot', accent);
    let chip = '';
    if(k!=='general'){ const d=siteDias(k), n=nivel(d); chip = `<span class="nav-chip ${n.cls}">${d!==null? d.toFixed(1)+' d':'—'}</span>`; }
    btn.innerHTML = icon(k==='general'?IC.grid:IC.pin) + `<span class="lbl-txt">${k==='general'?'General':SITES[k].name}</span>` + chip;
    btn.onclick = ()=>{ currentTab=k; render(); };
    tabs.appendChild(btn);
  });
}

function render(){
  refreshToday();
  const focus = captureFocus();
  destroyAllCharts();
  try{ buildTabs(); }catch(e){ console.error('Error en menú', e); }
  const panels = document.getElementById('panels'); panels.innerHTML='';
  Object.keys(SITES).forEach(k=>{
    const p=document.createElement('div'); p.className='panel'+(k===currentTab?' active':'');
    p.innerHTML = safe(SITES[k].name, ()=>siteHTML(k)); panels.appendChild(p);
  });
  const gp=document.createElement('div'); gp.className='panel'+(currentTab==='general'?' active':'');
  gp.innerHTML = safe('General', ()=>generalHTML()); panels.appendChild(gp);
  try{ if(currentTab==='general') wireGeneral(); else wireSite(currentTab); }
  catch(e){ console.error('Error al conectar controles', e); }
  if(!CHARTS_OK){
    document.querySelectorAll('.chart-box').forEach(b=>{ b.innerHTML='<div class="empty-state">No se pudieron cargar las gráficas (sin internet o CDN bloqueado). Tablas y cálculos funcionan normal.</div>'; });

}

function wireSite(k){
  const tb=document.getElementById('tbody-'+k);
  document.getElementById('consumo-'+k).oninput = e=>{ state[k].consumo = e.target.value; saveState(k); updateSite(k); };
  document.getElementById('add-'+k).onclick = ()=>{ state[k].rows.push({fecha:iso(TODAY),bodega:'',marca:'',micraje:'',kg:0}); saveState(k); render(); };
  tb.querySelectorAll('tr[data-i]').forEach(tr=>{
    const i=+tr.dataset.i, row=state[k].rows[i];
    tr.querySelector('.f-fecha').oninput = e=>{ row.fecha=e.target.value; saveState(k); };
    tr.querySelector('.f-bodega').oninput = e=>{ row.bodega=e.target.value; saveState(k); updateSite(k); };
    tr.querySelector('.f-micraje').oninput = e=>{ row.micraje=e.target.value; saveState(k); };
    wireKg(k, tr.querySelector('.f-kg'), v=>{ row.kg=v; }, ()=>row.kg, ()=>updateSite(k));
    wireProd(k, tr, 'f-marca', v=>{ row.marca=v; }, ()=>updateSite(k));
    tr.querySelector('.del-btn').onclick = ()=>{
      const kg=parseFloat(row.kg)||0;
      if((kg>0 || row.bodega) && !confirm('¿Eliminar la bodega "'+(row.bodega||'sin nombre')+'" ('+fmt(kg)+' kg)?')) return;
      state[k].rows.splice(i,1); saveState(k); render(); };
  });
  const tf=document.getElementById('tbody-fact-'+k);
  document.getElementById('add-fact-'+k).onclick = ()=>{ state[k].facturas.push({orden:'',fecha:'',producto:'',micraje:'',cantidad:0}); saveState(k); render(); };
  tf.querySelectorAll('tr[data-i]').forEach(tr=>{
    const i=+tr.dataset.i, f=state[k].facturas[i];
    tr.querySelector('.ff-orden').oninput = e=>{ f.orden=e.target.value; saveState(k); };
    tr.querySelector('.ff-fecha').oninput = e=>{ f.fecha=e.target.value; saveState(k); updateSite(k); };
    tr.querySelector('.ff-micraje').oninput = e=>{ f.micraje=e.target.value; saveState(k); };
    wireKg(k, tr.querySelector('.ff-cantidad'), v=>{ f.cantidad=v; }, ()=>f.cantidad, ()=>updateSite(k));
    wireProd(k, tr, 'ff-producto', v=>{ f.producto=v; }, ()=>{});
    tr.querySelector('.ff-del').onclick = ()=>{
      if((f.orden || (parseFloat(f.cantidad)||0)>0) && !confirm('¿Eliminar la factura '+(f.orden||'sin número')+' ('+fmt(f.cantidad)+' kg)?')) return;
      state[k].facturas.splice(i,1); saveState(k); render(); };
  });
  drawSiteCharts(k);
}
function wireKg(k, inp, set, get, after){
  inp.oninput = e=>{ set(parseInt(e.target.value.replace(/[^\d]/g,''))||0); saveState(k); after(); };
  inp.onfocus = e=>{ e.target.value = String(get()||''); };
  inp.onblur  = e=>{ e.target.value = fmt(get()); };
}
function wireProd(k, tr, cls, set, after){
  const sel=tr.querySelector('.'+cls), otro=tr.querySelector('.'+cls+'-otro'), dot=tr.querySelector('.prod-dot');
  sel.onchange = e=>{
    if(e.target.value==='__otro__'){ otro.style.display='block'; otro.focus(); set(otro.value); }
    else { otro.style.display='none'; set(e.target.value); }
    dot.style.background = prodColor(e.target.value==='__otro__'?otro.value||'x':e.target.value);
    saveState(k); after();
  };
  otro.oninput = e=>{ set(e.target.value); saveState(k); after(); };
}
function updateSite(k){
  const t=siteTotal(k), c=siteConsumo(k);
  document.getElementById('kpi-stock-'+k).innerHTML = kpiStockInner(k);
  document.getElementById('kpi-dias-'+k).innerHTML = kpiDiasInner(k);
  document.getElementById('kpi-fact-'+k).innerHTML = kpiFactInner(k);
  document.getElementById('kpi-consumo-sub-'+k).innerHTML = c>0? '<b>'+fmtTon(c*7)+' ton</b> por semana':'Todas las bodegas del sitio';
  document.getElementById('tfoot-'+k).textContent = fmt(t);
  document.getElementById('tfoot-fact-'+k).textContent = fmt(facturasTotal(k));
  document.getElementById('fact-hint-'+k).textContent = fmtTon(facturasTotal(k))+' ton por recibir';
  document.getElementById('weeklist-'+k).innerHTML = weeksHTML(k);
  document.querySelectorAll('#tbody-'+k+' tr[data-i]').forEach(tr=>{
    const r=state[k].rows[+tr.dataset.i], p = t>0?(parseFloat(r.kg)||0)/t*100:0;
    const sp=tr.querySelector('.share .bar span'); sp.style.width=p+'%'; sp.style.background=prodColor(r.marca);
    tr.querySelector('.pct').textContent = p.toFixed(0)+'%';
  });
  buildTabs(); drawSiteCharts(k);
}

function emptyBox(boxId, msg){
  const b=document.getElementById(boxId); if(!b) return;
  b.innerHTML = `<div class="empty-state">${icon(IC.chart)}<span>${msg}</span></div>`;
}
function ensureCanvas(boxId, canvasId){
  const b=document.getElementById(boxId); if(b && !document.getElementById(canvasId)) b.innerHTML=`<canvas id="${canvasId}"></canvas>`;
}

function drawSiteCharts(k){ if(!CHARTS_OK) return; try{ drawSiteChartsInner(k); }catch(e){ console.error('Error en gráficas', e); } }
function drawSiteChartsInner(k){
  const s=SITES[k], rows=state[k].rows.filter(r=>(parseFloat(r.kg)||0)>0);
  // 1) Stock por bodega: barras horizontales apiladas por producto, ordenadas
  if(!rows.length){ if(charts['chart-'+k]){charts['chart-'+k].destroy(); delete charts['chart-'+k];} emptyBox('box-bod-'+k,'Sin stock registrado'); }
  else {
    ensureCanvas('box-bod-'+k,'chart-'+k);
    const bods={}; rows.forEach(r=>{ const b=r.bodega||'(sin nombre)'; bods[b]=(bods[b]||0)+(parseFloat(r.kg)||0); });
    const labels=Object.keys(bods).sort((a,b)=>bods[b]-bods[a]);
    const prods=[...new Set(rows.map(r=>r.marca||''))];
    const datasets=prods.map((p,pi)=>({
      label: prodShort(p),
      data: labels.map(b=>rows.filter(r=>(r.bodega||'(sin nombre)')===b && (r.marca||'')===p).reduce((a,r)=>a+(parseFloat(r.kg)||0),0)/1000),
      backgroundColor: prodColor(p), borderRadius:4, barThickness:18,
      datalabels: pi===prods.length-1 ? {display:true, anchor:'end', align:'right', offset:4, color:'#1C2B3A', font:{weight:'700',size:11},
        formatter:(v,ctx)=>{ const tot=bods[labels[ctx.dataIndex]]/1000; return tot.toLocaleString('es-MX',{maximumFractionDigits:1}); }} : {display:false}
    }));
    mkChart('chart-'+k,{type:'bar',data:{labels,datasets},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,layout:{padding:{right:36}},
        plugins:{legend:{display:prods.length>1,position:'bottom'},tooltip:{position:'aLado',callbacks:{label:c=>` ${c.dataset.label}: ${c.raw.toLocaleString('es-MX',{maximumFractionDigits:1})} ton`}}},
        scales:{x:{stacked:true,grid:GRID,border:{display:false},ticks:{callback:v=>v+' t'}},y:{stacked:true,grid:{display:false},border:{display:false},ticks:{color:'#1C2B3A',font:{weight:'600'}}}}}});
  }
  // 2) Proyección con fechas reales + facturas + umbral de seguridad
  const c=siteConsumo(k), t=siteTotal(k);
  if(c<=0){ if(charts['depl-'+k]){charts['depl-'+k].destroy(); delete charts['depl-'+k];} emptyBox('box-depl-'+k,'Captura el consumo diario para ver la proyección'); }
  else {
    ensureCanvas('box-depl-'+k,'depl-'+k);
    const pre = simulate(k,120);
    const end = Math.min(60, Math.max(14, Math.ceil(t/c), pre.agotaConF===null? 30 : Math.ceil(pre.agotaConF))+4);
    const sim = simulate(k,end);
    const labels=[]; for(let d=0; d<=end; d++) labels.push(fDate(addDays(TODAY,d)));
    const hasF = facturasTotal(k)>0;
    const ds=[{label:'Stock actual',data:sim.solo.map(v=>v/1000),borderColor:s.a,backgroundColor:hexToRgba(s.a,.12),fill:true,tension:.2,pointRadius:0,borderWidth:2.5}];
    if(hasF) ds.push({label:'Con facturas',data:sim.conF.map(v=>v/1000),borderColor:'#1A6EA8',borderDash:[6,4],fill:false,tension:0,pointRadius:sim.conF.map((v,i)=>sim.arrivals[i]&&i>0?4:0),pointBackgroundColor:'#1A6EA8',borderWidth:2});
    ds.push({label:'Mínimo 7 días',data:labels.map(()=>c*7/1000),borderColor:'#C0303B',borderDash:[3,4],borderWidth:1.3,pointRadius:0,fill:false});
    const dAg = Math.ceil(t/c);
    mkChart('depl-'+k,{type:'line',data:{labels,datasets:ds},plugins:[todayLine],
      options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
        plugins:{legend:{position:'bottom'},todayLine: dAg<=end ? {idx:dAg,label:'Agota '+fDate(addDays(TODAY,dAg)),color:'#C0303B'} : {},
          tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${c.raw.toLocaleString('es-MX',{maximumFractionDigits:1})} ton`}}},
        scales:{x:{grid:{display:false},ticks:{maxTicksLimit:8,maxRotation:0}},y:{grid:GRID,border:{display:false},beginAtZero:true,ticks:{callback:v=>v+' t'}}}}});
  }
  // 3) Mezcla por producto (dona con total al centro)
  if(!rows.length){ if(charts['mix-'+k]){charts['mix-'+k].destroy(); delete charts['mix-'+k];} emptyBox('box-mix-'+k,'Sin stock registrado'); }
  else {
    ensureCanvas('box-mix-'+k,'mix-'+k);
    const m={}; rows.forEach(r=>{ m[r.marca||'']=(m[r.marca||'']||0)+(parseFloat(r.kg)||0); });
    const keys=Object.keys(m).sort((a,b)=>m[b]-m[a]);
    mkChart('mix-'+k,{type:'doughnut',plugins:[centerText],
      data:{labels:keys.map(prodShort),datasets:[{data:keys.map(x=>m[x]/1000),backgroundColor:keys.map(prodColor),borderColor:'#fff',borderWidth:3,hoverOffset:6}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'68%',
        plugins:{centerText:{top:fmtTon(t)+' t',bottom:'en stock'},legend:{position:'right',labels:{font:{size:11.5}}},
          tooltip:{callbacks:{label:c=>` ${c.label}: ${c.raw.toLocaleString('es-MX',{maximumFractionDigits:1})} ton (${(c.raw*1000/t*100).toFixed(0)}%)`}}}}});
  }
}

/* ---------- General ---------- */
function generalHTML(){
  const keys=Object.keys(SITES);
  const gT=keys.reduce((a,k)=>a+siteTotal(k),0), gC=keys.reduce((a,k)=>a+siteConsumo(k),0), gF=keys.reduce((a,k)=>a+facturasTotal(k),0);
  const gD = gC>0? gT/gC : null, n=nivel(gD);
  const maxT = Math.max(1,...keys.map(siteTotal));
  const ton0 = n => Math.round((n||0)/1000).toLocaleString('es-MX');
  const rows = keys.map(k=>{
    const s=SITES[k], d=siteDias(k), nv=nivel(d), t=siteTotal(k);
    return `<tr class="ro">
      <td><span class="pill" style="background:${hexToRgba(s.a,.1)};color:${s.a}"><span class="dot" style="background:${s.a}"></span>${s.name}</span></td>
      <td class="c tnum"><b>${ton0(t)}</b><div class="mini-bar"><span style="width:${t/maxT*100}%;background:${s.a}"></span></div></td>
      <td class="c tnum">${ton0(siteConsumo(k))}</td>
      <td class="c tnum">${ton0(facturasTotal(k))}</td>
      <td class="c"><span class="head-chip st-${nv.cls}" style="padding:3px 9px;font-size:12px;"><span class="dot"></span>${d!==null? Math.round(d)+' d':'—'}</span></td>
    </tr>`;}).join('');
  const comb=[]; keys.forEach(k=>state[k].facturas.forEach(f=>{ if(f.fecha||f.producto||(parseFloat(f.cantidad)||0)>0) comb.push({site:k,...f}); }));
  comb.sort((a,b)=>(a.fecha||'9999').localeCompare(b.fecha||'9999'));
  const factRows = comb.map(f=>{
    const d=parseISO(f.fecha), off = d? Math.round((d-TODAY)/864e5) : null;
    const cls = off===null?'':(off<0?'late':(off<=7?'soon':''));
    const txt = d? fDateLong(d)+(off!==null? (off<0?' · vencida':off===0?' · hoy':' · en '+off+' d'):'') : '—';
    return `<tr class="ro"><td>${esc(f.orden||'—')}</td><td><span class="date-badge ${cls}">${txt}</span></td>
      <td><span class="pill" style="background:${hexToRgba(SITES[f.site].a,.1)};color:${SITES[f.site].a}">${SITES[f.site].name}</span></td>
      <td><span class="prod-cell" style="padding:0"><span class="prod-dot" style="background:${prodColor(f.producto)}"></span>${esc(prodShort(f.producto))}</span></td>
      <td class="c">${esc(f.micraje||'—')}</td><td class="r tnum"><b>${fmt(f.cantidad)}</b></td></tr>`;}).join('');
  return `
  <div class="page-head"><div><div class="crumb">Resumen consolidado</div><h2>General — todos los sitios</h2></div></div>
  <div class="kpis">
    <div class="kpi" style="--accent:var(--navy);--tint:rgba(31,78,121,.1)"><div class="kpi-top"><span class="lbl">Stock total</span><span class="kpi-icon">${icon(IC.box)}</span></div>
      <div class="kpi-value tnum">${fmtTon(gT)}<small>ton</small></div><div class="sub"><b>${fmt(gT)}</b> kg en ${keys.length} sitios</div></div>
    <div class="kpi" style="--accent:var(--amber);--tint:rgba(217,123,26,.1)"><div class="kpi-top"><span class="lbl">Consumo combinado</span><span class="kpi-icon">${icon(IC.sack)}</span></div>
      <div class="kpi-value tnum">${fmtTon(gC)}<small>ton/día</small></div><div class="sub"><b>${fmtTon(gC*7)} ton</b> por semana</div></div>
    <div class="kpi" style="--accent:var(--teal);--tint:rgba(0,122,104,.1)"><div class="kpi-top"><span class="lbl">Días de alcance general</span><span class="kpi-icon">${icon(IC.cal)}</span></div>
      ${gD===null? '<div class="kpi-value">—</div>' : `<div class="kpi-value tnum" style="color:${n.color}">${gD.toFixed(1)}<small>días</small></div>
      <div class="meter" style="--bar:${n.color}"><span style="width:${Math.min(100,gD/ESCALA_DIAS*100)}%"></span><i class="tick" style="left:${CRIT_DIAS/ESCALA_DIAS*100}%"></i><i class="tick" style="left:${META_DIAS/ESCALA_DIAS*100}%"></i></div>
      <div class="sub">${(gD/7).toFixed(1)} semanas</div>`}</div>
    <div class="kpi" style="--accent:var(--blue);--tint:rgba(26,110,168,.1)"><div class="kpi-top"><span class="lbl">Total a recibir</span><span class="kpi-icon">${icon(IC.truck)}</span></div>
      <div class="kpi-value tnum">${fmtTon(gF)}<small>ton</small></div><div class="sub">${comb.length} factura(s) pendientes</div></div>
  </div>
  <div class="grid2 even">
    <div class="card"><div class="card-head"><h3>Stock por sitio y producto</h3><span class="hint">toneladas</span></div><div class="chart-box"><canvas id="chart-general"></canvas></div></div>
    <div class="card"><div class="card-head"><h3>Comparativo por sitio</h3></div>
      <div class="tbl-wrap fit"><table class="cmp-table">
        <colgroup><col style="width:24%"><col style="width:20%"><col style="width:19%"><col style="width:18%"><col style="width:19%"></colgroup>
        <thead><tr><th>Sitio</th><th class="c">Stock (t)</th><th class="c">Consumo t/día</th><th class="c">Por recibir (t)</th><th class="c">Alcance</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td>Total</td><td class="c">${ton0(gT)}</td><td class="c">${ton0(gC)}</td><td class="c">${ton0(gF)}</td><td class="c">${gD!==null?Math.round(gD)+' d':'—'}</td></tr></tfoot>
      </table></div></div>
  </div>
  <div class="card" style="margin-bottom:16px;"><div class="card-head"><h3>Proyección de agotamiento por sitio</h3><span class="hint">stock actual, sin facturas</span></div>
    <div class="chart-box sm" id="box-depl-general"><canvas id="depl-general"></canvas></div></div>
  <div class="card"><div class="card-head"><h3>Calendario de facturas por llegar</h3><span class="hint">ordenadas por fecha</span></div>
    ${comb.length? `<div class="tbl-wrap"><table><thead><tr><th>Orden</th><th>Fecha esperada</th><th>Sitio</th><th>Producto</th><th class="c">Micraje</th><th class="r">Kg</th></tr></thead>
      <tbody>${factRows}</tbody><tfoot><tr><td colspan="5">Total</td><td class="r">${fmt(gF)} kg</td></tr></tfoot></table></div>`
      : `<div class="alert">Sin facturas pendientes en ningún sitio.</div>`}
  </div>`;
}
function wireGeneral(){ if(!CHARTS_OK) return; try{ wireGeneralInner(); }catch(e){ console.error('Error en gráficas generales', e); } }
function wireGeneralInner(){
  const keys=Object.keys(SITES);
  const allRows = keys.flatMap(k=>state[k].rows.map(r=>({...r,site:k})));
  const prods=[...new Set(allRows.filter(r=>(parseFloat(r.kg)||0)>0).map(r=>r.marca||''))];
  mkChart('chart-general',{type:'bar',
    data:{labels:keys.map(k=>SITES[k].name),datasets:prods.map((p,pi)=>({label:prodShort(p),backgroundColor:prodColor(p),borderRadius:4,maxBarThickness:70,
      data:keys.map(k=>state[k].rows.filter(r=>(r.marca||'')===p).reduce((a,r)=>a+(parseFloat(r.kg)||0),0)/1000),
      datalabels: pi===prods.length-1 ? {display:true,anchor:'end',align:'top',color:'#1C2B3A',font:{weight:'700',size:12},
        formatter:(v,ctx)=>fmtTon(siteTotal(keys[ctx.dataIndex]))+' t'}:{display:false}}))},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:24}},
      plugins:{legend:{position:'bottom'},tooltip:{position:'aLado',callbacks:{label:c=>` ${c.dataset.label}: ${c.raw.toLocaleString('es-MX',{maximumFractionDigits:1})} ton`}}},
      scales:{x:{stacked:true,grid:{display:false},ticks:{color:'#1C2B3A',font:{weight:'600',size:12.5}}},y:{stacked:true,grid:GRID,border:{display:false},ticks:{callback:v=>v+' t'}}}}});
  const sd = keys.filter(k=>siteConsumo(k)>0);
  if(!sd.length){ emptyBox('box-depl-general','Captura el consumo diario en algún sitio'); return; }
  const end = Math.min(60, Math.max(...sd.map(k=>Math.ceil(siteTotal(k)/siteConsumo(k))))+4);
  const labels=[]; for(let d=0; d<=end; d++) labels.push(fDate(addDays(TODAY,d)));
  mkChart('depl-general',{type:'line',
    data:{labels,datasets:sd.map(k=>({label:SITES[k].name,data:labels.map((_,i)=>Math.max(0,siteTotal(k)-siteConsumo(k)*i)/1000),borderColor:SITES[k].a,backgroundColor:hexToRgba(SITES[k].a,.08),fill:true,tension:.2,pointRadius:0,borderWidth:2.5}))},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${c.raw.toLocaleString('es-MX',{maximumFractionDigits:1})} ton`}}},
      scales:{x:{grid:{display:false},ticks:{maxTicksLimit:9,maxRotation:0}},y:{grid:GRID,border:{display:false},beginAtZero:true,ticks:{callback:v=>v+' t'}}}}});
}

if(firebaseOK){
  db.ref('.info/connected').on('value', snap=>{
    if(snap.val()===true) setSyncStatus('🟢 En vivo — sincronizado con el equipo', true);
    else setSyncStatus('🔴 Sin conexión — guardado local', false);
  });
  dbRef.on('value', snap=>{
    const data = snap.val();
    if(data){
      firebaseSeeded = true;
      const incoming = ensureState(data);
      // Si hay cambios propios aún sin subir, se conservan esos sitios locales
      dirtySites.forEach(k=>{ incoming[k] = state[k]; });
      if(stableStr(incoming) === stableStr(state)) return;   // eco propio o sin cambios reales
      state = incoming;
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
      touchUpdated(); render();
    } else if(!firebaseSeeded){
      firebaseSeeded = true;
      Object.keys(SITES).forEach(k=>dirtySites.add(k));
      pushToFirebase();                          // Firebase vacío: se siembra con el estado local
    }
  }, err=>{
    console.error('Firebase read error', err);
    setSyncStatus('🔴 Sin permiso o sin conexión — mostrando datos locales', false);
  });
} else {
  setSyncStatus('💾 Modo local (sin conexión a Firebase)', false);
}

document.getElementById('refreshBtn').onclick = ()=>{
  if(firebaseOK){
    setSyncStatus('Actualizando…', true);
    dbRef.once('value').then(snap=>{
      const data = snap.val();
      if(data){ const inc = ensureState(data); dirtySites.forEach(k=>{ inc[k]=state[k]; }); state = inc; try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
      setSyncStatus('🟢 En vivo — sincronizado con el equipo', true);
      touchUpdated(); render();
    }).catch(()=>setSyncStatus('🔴 Sin conexión — guardado local', false));
  } else { state = loadState(); touchUpdated(); render(); }
};

touchUpdated();
render();
// Si la pestaña queda abierta al cambiar el día, se actualizan fechas y proyecciones
setInterval(()=>{ const d=new Date(); d.setHours(0,0,0,0); if(d.getTime()!==TODAY.getTime() && !captureFocus()) render(); }, 60*60*1000);
</script>
