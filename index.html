<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario de Alimento — Grupo Acuícola Santa Fe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#F4F6F9; --card:#FFFFFF; --bg2:#EEF2F7; --border:#D8E3EE;
  --teal:#007A68; --teal-light:#00C9A7; --blue:#1A6EA8; --amber:#D97B1A; --red:#C0303B;
  --text:#1C2B3A; --muted:#6B859E;
  --santafe1:#007A68; --santafe2:#00C9A7;
  --owen1a:#8B5A2B; --owen1b:#F4A261;
  --owen2a:#7A1A22; --owen2b:#E63946;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
h1,h2,h3,.num,.kpi-value{font-family:'Barlow Condensed',sans-serif;}
.app{display:flex;min-height:100vh;}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

/* Sidebar */
.sidebar{width:250px;flex-shrink:0;background:linear-gradient(180deg,#173B60,#12304F 55%,#0E2740);color:#fff;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;}
.brand{padding:0 6px 4px;}
.brand-logo{background:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:center;}
.brand-logo img{max-width:100%;height:auto;display:block;}
.brand h1{margin:12px 0 0;font-size:17px;line-height:1.15;font-weight:700;color:#fff;}
.brand-sub{padding:6px 6px 20px;font-size:12px;color:#8FB3D1;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px;}
.side-nav{display:flex;flex-direction:column;gap:4px;flex:1;}
.side-link{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;border:none;border-left:3px solid transparent;background:transparent;color:#9FC1DE;font-size:14.5px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;text-align:left;transition:.15s;}
.side-link .icon{stroke:#9FC1DE;}
.side-link:hover{background:rgba(255,255,255,.06);color:#fff;}
.side-link:hover .icon{stroke:#fff;}
.side-link.active{background:rgba(255,255,255,.12);color:#fff;border-left-color:var(--dot,var(--teal-light));}
.side-link.active .icon{stroke:var(--dot,var(--teal-light));}
.side-dot{width:8px;height:8px;border-radius:50%;background:var(--dot,#9FC1DE);flex-shrink:0;}
.side-footer{border-top:1px solid rgba(255,255,255,.1);padding-top:14px;}
.sync-card{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-radius:10px;padding:10px 12px;}
.sync-card .icon{stroke:#8FB3D1;}
#refreshBtn{background:none;border:none;padding:4px;cursor:pointer;border-radius:6px;display:flex;}
#refreshBtn:hover{background:rgba(255,255,255,.12);}
#refreshBtn:hover .icon{stroke:#fff;}
.sync-label{font-size:12px;font-weight:700;color:#fff;}
.sync-time{font-size:10.5px;color:#8FB3D1;margin-top:1px;}

/* Main */
.main{flex:1;min-width:0;padding:24px 28px 60px;max-width:1320px;}
.page-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
.page-title h2{margin:0;font-size:26px;font-weight:700;}
.panel{display:none;}
.panel.active{display:block;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px;}
.kpi{background:var(--card);border-radius:12px;border-left:4px solid var(--accent,var(--blue));padding:14px 16px;box-shadow:0 1px 3px rgba(20,40,60,.06);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.kpi .lbl{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;}
.kpi .kpi-value{font-size:30px;font-weight:700;color:var(--text);line-height:1.15;margin-top:2px;}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:4px;}
.kpi-icon{width:38px;height:38px;border-radius:50%;background:var(--accent-tint,rgba(26,110,168,.1));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.kpi-icon .icon{stroke:var(--accent,var(--blue));width:18px;height:18px;}
.kpi.consumo-card{border-left-color:var(--amber);}
.kpi.consumo-card input{width:100%;font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;border:1px solid var(--border);border-radius:6px;padding:4px 8px;margin-top:2px;color:var(--text);background:var(--bg2);}
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-bottom:20px;}
@media(max-width:900px){.grid2{grid-template-columns:1fr;} .app{flex-direction:column;} .sidebar{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;align-items:center;} .side-nav{flex-direction:row;flex-wrap:wrap;} .brand-sub{display:none;} .side-footer{width:100%;}}
.card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:18px 20px;box-shadow:0 1px 3px rgba(20,40,60,.05);}
.card h3{margin:0 0 14px;font-size:20px;font-weight:600;color:var(--text);}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{background:#1F4E79;color:#C8E0F4;text-align:center;padding:9px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;}
th:first-child{border-radius:6px 0 0 0;} th:last-child{border-radius:0 6px 0 0;}
td{padding:0;border-bottom:1px solid var(--border);text-align:center;vertical-align:middle;}
td input, td select{width:100%;border:none;background:transparent;padding:8px 6px;font-size:13.5px;color:var(--text);font-family:'Inter',sans-serif;text-align:center;text-align-last:center;}
td input:focus, td select:focus{outline:2px solid var(--blue);outline-offset:-2px;background:#fff;}
table.site-table{table-layout:fixed;}
table.site-table col.c-fecha{width:12%;}
table.site-table col.c-bodega{width:14%;}
table.site-table col.c-marca{width:40%;}
table.site-table col.c-micraje{width:9%;}
table.site-table col.c-kg{width:16%;}
table.site-table col.c-del{width:9%;}
table.site-table td .f-marca{font-size:12.8px;}
table.site-table td .f-marca-otro{margin-top:2px;}
tr:hover td{background:#F0F7FF;}
.del-btn{background:none;border:none;color:var(--red);cursor:pointer;padding:6px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;}
.del-btn:hover{background:rgba(192,48,59,.1);}
.del-btn .icon{stroke:var(--red);width:16px;height:16px;}
tfoot td{font-weight:700;background:var(--bg2);color:#1F4E79;padding:10px;}
.add-row-btn{margin-top:12px;background:var(--teal);color:#fff;border:none;padding:8px 16px;border-radius:7px;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
.add-row-btn .icon{stroke:#fff;width:15px;height:15px;}
.add-row-btn:hover{background:var(--teal-light);}
.chart-box{position:relative;height:280px;}
.chart-box.small{height:220px;}
.alert{font-size:13px;color:var(--muted);background:var(--bg2);border-radius:8px;padding:10px 14px;margin-top:8px;}
.alert.bad{background:rgba(192,48,59,.1);color:#8B1E27;}
.alert.warn{background:rgba(217,123,26,.1);color:#9A5610;}
.alert.good{background:rgba(0,122,104,.1);color:#005A4D;}
.week-list{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
.week-row{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 10px;border-radius:6px;background:var(--bg2);}
.week-row b{color:#1F4E79;}
.week-row.empty{background:rgba(192,48,59,.08);color:#8B1E27;}
.gen-table{table-layout:fixed;}
.gen-table td, .gen-table th{text-align:center;vertical-align:middle;width:20%;}
.save-tag-wrap{text-align:right;margin-top:4px;}
.save-tag{font-size:11.5px;color:var(--teal);opacity:0;transition:opacity .4s;}
.save-tag.show{opacity:1;}
</style>
</head>

function ensureFacturas(st){
  Object.keys(SITES).forEach(k=>{
    if(!st[k]) st[k] = {consumo:0, rows:[], facturas:[]};
    if(!Array.isArray(st[k].facturas)) st[k].facturas = [];
  });
  return st;
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return ensureFacturas(JSON.parse(raw));
  }catch(e){}
  return defaultState();
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  touchUpdated();
  const tag = document.getElementById('saveTag');
  tag.classList.add('show');
  clearTimeout(saveState._t);
  saveState._t = setTimeout(()=>tag.classList.remove('show'),1000);

  if(!firebaseOK) return;
  clearTimeout(firebaseSaveTimer);
  firebaseSaveTimer = setTimeout(pushToFirebase, 600);
}

function pushToFirebase(){
  if(!firebaseOK) return;
  const json = JSON.stringify(state);
  lastSentJSON = json;
  dbRef.set(state).catch(err=>{
    console.error('Firebase write error', err);
    setSyncStatus('🔴 Sin conexión — guardado solo local', false);
  });
}

function setSyncStatus(text, ok){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  el.textContent = text;
  el.style.color = ok ? '#fff' : '#F4B8B8';
}

    else setSyncStatus('🔴 Sin conexión — guardado local', false);
  });

  dbRef.on('value', snap=>{
    const data = snap.val();
    if(data){
      const json = JSON.stringify(data);
      firebaseSeeded = true;
      if(json === lastSentJSON) return; // eco de nuestro propio guardado, no re-renderizar
      state = ensureFacturas(data);
      localStorage.setItem(STORAGE_KEY, json);
      touchUpdated();
      render();
    } else if(!firebaseSeeded){
      firebaseSeeded = true;
      pushToFirebase(); // no hay datos aún en Firebase: sembramos con el estado local/default
    }
  });

function siteTotal(key){

function facturasTotal(key){
  return state[key].facturas.reduce((s,r)=>s+(parseFloat(r.cantidad)||0),0);

function siteDias(key){

}

function weeklyProjection(total, consumo, maxWeeks){
  if(consumo<=0) return `<div class="alert">Sin consumo diario capturado.</div>`;
  let html = '';
  let remaining = total;
  for(let w=1; w<=maxWeeks; w++){
    remaining -= consumo*7;
    if(remaining <= 0){
      const daysIntoWeek = ( (total - consumo*7*(w-1)) / consumo );
      html += `<div class="week-row empty"><span>Semana ${w}</span><b>Se agota (día ${daysIntoWeek.toFixed(1)} de esta semana)</b></div>`;
      break;
    }
    html += `<div class="week-row"><span>Fin semana ${w}</span><b>${fmtTon(remaining)} ton restantes</b></div>`;
  }
  if(remaining>0) html += `<div class="alert good">Alcanza más allá de ${maxWeeks} semanas al ritmo actual.</div>`;
  return html;
}

    saveState();
    render();
  };

  tbody.querySelectorAll('tr').forEach(tr=>{

    const marcaSel = tr.querySelector('.f-marca');

  const total = siteTotal(key);

  const dias = siteDias(key);
  const semanas = dias!==null ? (dias/7) : null;

  document.getElementById('kpi-stock-'+key).textContent = fmtTon(total)+' ton';
  document.getElementById('kpi-stock-sub-'+key).textContent = fmt(total)+' kg en '+state[key].rows.length+' bodega(s)';

  document.getElementById('kpi-dias-sub-'+key).textContent = consumo>0 ? 'stock ÷ consumo diario' : 'ingresa el consumo diario';
  document.getElementById('kpi-semanas-'+key).textContent = semanas!==null ? semanas.toFixed(1)+' sem' : '—';
  document.getElementById('kpi-semanas-sub-'+key).textContent = consumo>0 ? fmt(consumo*7)+' kg/semana' : '';
  document.getElementById('tfoot-'+key).textContent = fmt(total)+' kg';
  document.getElementById('weeklist-'+key).innerHTML = weeklyProjection(total, consumo, 8);
  drawSiteCharts(key);
}

function drawSiteCharts(key){
  const s = SITES[key];
  const rows = state[key].rows.filter(r=>r.bodega);
  const ctx1 = document.getElementById('chart-'+key);
  if(charts['chart-'+key]) charts['chart-'+key].destroy();
  if(ctx1){
    charts['chart-'+key] = new Chart(ctx1, {
      type:'bar',
      data:{
        labels: rows.map(r=>r.bodega),
        datasets:[{
          label:'Stock (kg)',
          data: rows.map(r=>parseFloat(r.kg)||0),
          backgroundColor: makeGradient(ctx1, s.a, s.b),
          borderRadius:5,
          datalabels: barDatalabels
        }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        layout:{padding:{top:22}},
        plugins:{legend:{display:false}},
        scales:{ y:{ ticks:{ callback:v=>v.toLocaleString('es-MX') } } }
      }
    });
  }

  const total = siteTotal(key);
  const consumo = siteConsumo(key);
  const ctx2 = document.getElementById('depl-'+key);
  if(charts['depl-'+key]) charts['depl-'+key].destroy();
  if(ctx2 && consumo>0){
    const days = Math.min(60, Math.ceil(total/consumo)+3);
    const labels=[], data=[];
    for(let d=0; d<=days; d++){ labels.push('Día '+d); data.push(Math.max(0, total-consumo*d)); }
    charts['depl-'+key] = new Chart(ctx2, {
      type:'line',
      data:{ labels, datasets:[{
        label:'Stock restante (kg)', data,
        borderColor:s.a, backgroundColor:hexToRgba(s.a,.15), fill:true, tension:.25, pointRadius:0
      }]},
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{legend:{display:false}},
        scales:{ x:{ ticks:{ maxTicksLimit:8 } }, y:{ ticks:{ callback:v=>v.toLocaleString('es-MX') } } } }
    });
  } else if(ctx2){
    charts['depl-'+key] = null;
  }
}

function makeGradient(canvas, c1, c2){
  const ctx = canvas.getContext('2d');
  const g = ctx.createLinearGradient(0,0,0,260);
  g.addColorStop(0,c2); g.addColorStop(1,c1);
  return g;
}
function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r=parseInt(h.substring(0,2),16), g=parseInt(h.substring(2,4),16), b=parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function generalHTML(){
  const keys = Object.keys(SITES);
  const totals = keys.map(k=>siteTotal(k));
  const consumos = keys.map(k=>siteConsumo(k));
  const grandTotal = totals.reduce((a,b)=>a+b,0);
  const grandConsumo = consumos.reduce((a,b)=>a+b,0);
  const grandDias = grandConsumo>0 ? grandTotal/grandConsumo : null;
  const facturasTotals = keys.map(k=>facturasTotal(k));
  const grandFacturas = facturasTotals.reduce((a,b)=>a+b,0);

  const rows = keys.map((k,idx)=>{
    const s = SITES[k];
    const dias = siteDias(k);
    return `<tr>
      <td>${s.name}</td>
      <td>${fmtTon(totals[idx])}</td>
      <td>${fmtTon(consumos[idx])}</td>
      <td>${dias!==null? dias.toFixed(1) : '0.0'}</td>
      <td>${dias!==null? (dias/7).toFixed(1) : '0.0'}</td>
    </tr>`;
  }).join('');

  return `
  <div class="page-title"><h2>General — todos los sitios</h2></div>
  <div class="kpis">
    <div class="kpi" style="--accent:#1F4E79;--accent-tint:rgba(31,78,121,.1);">
      <div>
        <div class="lbl">Stock Total (todos los sitios)</div>
        <div class="kpi-value">${fmtTon(grandTotal)} ton</div>
        <div class="sub">${fmt(grandTotal)} kg</div>
      </div>
      <div class="kpi-icon">${icon('<path d="M21 8l-9-5-9 5 9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>')}</div>
    </div>
    <div class="kpi" style="--accent:#D97B1A;--accent-tint:rgba(217,123,26,.1);">
      <div>
        <div class="lbl">Consumo diario combinado</div>
        <div class="kpi-value">${fmtTon(grandConsumo)} ton/día</div>
        <div class="sub">${fmt(grandConsumo)} kg/día</div>
      </div>
      <div class="kpi-icon">${icon('<path d="M6 2l1 4h10l1-4"/><path d="M4 7h16l-1.5 13a2 2 0 0 1-2 2H7.5a2 2 0 0 1-2-2L4 7Z"/>')}</div>
    </div>
    <div class="kpi" style="--accent:#007A68;--accent-tint:rgba(0,122,104,.1);">
      <div>
        <div class="lbl">Días de alcance general</div>
        <div class="kpi-value">${grandDias!==null? grandDias.toFixed(1)+' días':'—'}</div>
        <div class="sub">${grandDias!==null? (grandDias/7).toFixed(1)+' semanas':''}</div>
      </div>
      <div class="kpi-icon">${icon('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>')}</div>
    </div>
    <div class="kpi" style="--accent:#1A6EA8;--accent-tint:rgba(26,110,168,.1);">
      <div>
        <div class="lbl">Total a recibir (facturas)</div>
        <div class="kpi-value">${fmtTon(grandFacturas)} ton</div>
        <div class="sub">${fmt(grandFacturas)} kg pendientes de todos los sitios</div>
      </div>
      <div class="kpi-icon">${icon('<path d="M21 8l-9-5-9 5 9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>')}</div>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <h3>Stock total por sitio</h3>
      <div class="chart-box"><canvas id="chart-general"></canvas></div>
    </div>
    <div class="card">
      <h3>Comparativo por sitio</h3>
      <table class="gen-table">
        <thead><tr><th>Sitio</th><th>Stock (ton)</th><th>Consumo (ton/día)</th><th>Días alcance</th><th>Semanas</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td>Total</td><td>${fmtTon(grandTotal)}</td><td>${fmtTon(grandConsumo)}</td><td>${grandDias!==null?grandDias.toFixed(1):'0.0'}</td><td>${grandDias!==null?(grandDias/7).toFixed(1):'0.0'}</td></tr></tfoot>
      </table>
    </div>
  </div>

  <div class="card" style="margin-top:16px;">
    <h3>Proyección de agotamiento — por sitio</h3>
    <div class="chart-box"><canvas id="depl-general"></canvas></div>
  </div>

  ${facturasGeneralHTML(keys, facturasTotals, grandFacturas)}
  `;
}

function facturasGeneralHTML(keys, facturasTotals, grandFacturas){
  const facRows = keys.map((k,idx)=>`
    <tr>
      <td style="padding:9px 10px;">${SITES[k].name}</td>
      <td style="padding:9px 10px;">${state[k].facturas.length}</td>
      <td style="padding:9px 10px;">${fmtTon(facturasTotals[idx])}</td>
    </tr>`).join('');

  const combined = [];
  keys.forEach(k=>{
    state[k].facturas.forEach(r=>{
      if(r.fecha || r.producto || (parseFloat(r.cantidad)||0)>0) combined.push({site:SITES[k].name, ...r});
    });
  });
  combined.sort((a,b)=> (a.fecha||'9999').localeCompare(b.fecha||'9999'));

  const combinedRows = combined.map(r=>`
    <tr>
      <td style="padding:9px 10px;">${r.fecha||'—'}</td>
      <td style="padding:9px 10px;">${r.site}</td>
      <td style="padding:9px 10px;">${r.producto||'—'}</td>
      <td style="padding:9px 10px;">${r.micraje||'—'}</td>
      <td style="padding:9px 10px;">${fmt(r.cantidad)} kg</td>
    </tr>`).join('');

  return `
  <div class="card" style="margin-top:16px;">
    <h3>Facturas próximas por llegar — todos los sitios</h3>
    <table style="width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:16px;">
      <thead><tr>
        <th style="background:#1F4E79;color:#C8E0F4;text-align:center;padding:9px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;">Sitio</th>
        <th style="background:#1F4E79;color:#C8E0F4;text-align:center;padding:9px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;">Facturas</th>
        <th style="background:#1F4E79;color:#C8E0F4;text-align:center;padding:9px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;">Total a recibir (ton)</th>
      </tr></thead>
      <tbody>${facRows}</tbody>
      <tfoot><tr style="font-weight:700;background:var(--bg2);color:#1F4E79;"><td style="padding:10px;text-align:center;">Total</td><td style="padding:10px;text-align:center;">${combined.length}</td><td style="padding:10px;text-align:center;">${fmtTon(grandFacturas)}</td></tr></tfoot>
    </table>
    ${combined.length ? `
    <table style="width:100%;border-collapse:collapse;font-size:13.5px;">
      <thead><tr>
        <th style="background:#1F4E79;color:#C8E0F4;text-align:center;padding:9px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;">Fecha</th>
        <th style="background:#1F4E79;color:#C8E0F4;text-align:center;padding:9px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;">Sitio</th>
        <th style="background:#1F4E79;color:#C8E0F4;text-align:center;padding:9px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;">Producto</th>
        <th style="background:#1F4E79;color:#C8E0F4;text-align:center;padding:9px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;">Micraje</th>
        <th style="background:#1F4E79;color:#C8E0F4;text-align:center;padding:9px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;">Cantidad</th>
      </tr></thead>
      <tbody>${combinedRows}</tbody>
    </table>` : `<div class="alert">Sin facturas pendientes registradas en ningún sitio.</div>`}
  </div>`;
}

function wireGeneral(){
  const keys = Object.keys(SITES);
  const ctx = document.getElementById('chart-general');
  if(charts['chart-general']) charts['chart-general'].destroy();
  if(ctx){
    charts['chart-general'] = new Chart(ctx, {
      type:'bar',
      data:{
        labels: keys.map(k=>SITES[k].name),
        datasets:[{
          label:'Stock (kg)',
          data: keys.map(k=>siteTotal(k)),
          backgroundColor: keys.map(k=>SITES[k].a),
          borderRadius:6,
          datalabels: barDatalabels
        }]
      },
      options:{ responsive:true, maintainAspectRatio:false,
        layout:{padding:{top:22}},
        plugins:{legend:{display:false}},
        scales:{ y:{ ticks:{ callback:v=>v.toLocaleString('es-MX') } } } }
    });
  }

  const ctx2 = document.getElementById('depl-general');
  if(charts['depl-general']) charts['depl-general'].destroy();
  if(ctx2){
    const siteData = keys.map(k=>({ key:k, s:SITES[k], total:siteTotal(k), consumo:siteConsumo(k) }))
                          .filter(d=>d.consumo>0);
    if(siteData.length){
      const maxDays = Math.min(60, Math.max(...siteData.map(d=>Math.ceil(d.total/d.consumo)))+3);
      const labels = []; for(let d=0; d<=maxDays; d++) labels.push('Día '+d);
      const datasets = siteData.map(d=>({
        label: d.s.name,
        data: labels.map((_,i)=>Math.max(0, d.total - d.consumo*i)),
        borderColor: d.s.a, backgroundColor: hexToRgba(d.s.a,.12), fill:false, tension:.25, pointRadius:0
      }));
      charts['depl-general'] = new Chart(ctx2, {
        type:'line',
        data:{ labels, datasets },
        options:{ responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{display:true, position:'bottom'} },
          scales:{ x:{ ticks:{ maxTicksLimit:8 } }, y:{ ticks:{ callback:v=>v.toLocaleString('es-MX') } } } }
      });
    } else {
      charts['depl-general'] = null;
    }
  }
}

document.getElementById('refreshBtn').onclick = ()=>{
  if(firebaseOK){
    setSyncStatus('Actualizando…', true);
    dbRef.once('value').then(snap=>{
      const data = snap.val();
      if(data){ state = data; localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
      touchUpdated();
      render();
    }).catch(()=>setSyncStatus('🔴 Sin conexión — guardado local', false));
  } else {
    state = loadState();
    touchUpdated();
    render();
  }
};

touchUpdated();
render();
</script>
</body>
</html>
